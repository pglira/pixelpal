[package]
name = "pixelpal-chat"
description = "The chat panel, the menu and the settings window of pixelpal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pixelpal-core.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
tauri = { version = "2.12.3", features = ["custom-protocol"] }

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

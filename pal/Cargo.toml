[package]
name = "pixelpal"
description = "A desktop pal that walks along the bottom of the screen and chats through the Claude Code CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pixelpal-core.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
fastrand.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1_smol = "1.0.1"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
rustix = { version = "1", features = ["event", "net"] }
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
x11rb = { version = "0.14.0", features = ["randr", "screensaver", "shape"] }

[workspace]
resolver = "3"
members = ["core", "pal", "chat"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
pixelpal-core = { path = "core" }
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
fastrand = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "pixelpal"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "A desktop pal that walks along the bottom of the screen and chats through the Claude Code CLI"
license = "MIT"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "links", "x11"] }
egui = "0.36.2"
egui_commonmark = { version = "0.25.0", default-features = false, features = ["pulldown_cmark"] }
fastrand = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
toml = "1.1.8"
x11rb = { version = "0.14.0", features = ["randr", "screensaver", "shape"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
